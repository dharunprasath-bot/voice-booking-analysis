[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "../netlify/functions"

[functions.course-reports]
  included_files = ["../reports/courses-*.txt"]

[[redirects]]
  from = "/api/reports"
  to = "/.netlify/functions/course-reports"
  status = 200
  force = true
